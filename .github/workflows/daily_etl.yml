name: Daily Crypto ETL Pipeline

on:
  schedule:
    # 18:30 UTC is exactly 00:00 (Midnight) IST
    - cron: '30 18 * * *' 
  workflow_dispatch: # Allows manual run button in GitHub UI

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r 02-descriptive_analytics/crypto_tracking_pipeline/requirements.txt

    - name: Execute ETL Pipeline Script
      run: |
        python 02-descriptive_analytics/crypto_tracking_pipeline/src/pipeline.py

    - name: Commit and Push Data Updates
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add 02-descriptive_analytics/crypto_tracking_pipeline/data/*
        git commit -m "chrono: automated daily warehouse update [skip ci]" || echo "No data changes detected"
        git push